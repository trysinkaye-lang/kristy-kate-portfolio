name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Lint source and tests
      run: npm run lint
    - name: Build application
      run: npm run build
    - name: Check TypeScript
      run: npm run typecheck
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests serially
      run: npm test -- --workers=1
    - name: Verify live exchange route and measure production performance
      env:
        RESEND_API_KEY: ""
        CONTACT_FROM_EMAIL: ""
        UPSTASH_REDIS_REST_URL: ""
        UPSTASH_REDIS_REST_TOKEN: ""
      run: |
        npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/portfolio-server.log 2>&1 &
        SERVER_PID=$!
        trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
        for attempt in {1..60}; do
          if curl -fsS http://127.0.0.1:3100/ > /dev/null; then
            break
          fi
          if [ "$attempt" -eq 60 ]; then
            cat /tmp/portfolio-server.log
            exit 1
          fi
          sleep 1
        done
        node scripts/verify-exchange-route.mjs
        node scripts/performance-review.mjs
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: performance-review
        path: .artifacts/review/performance.json
        retention-days: 30
