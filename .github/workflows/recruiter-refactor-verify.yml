name: Recruiter Refactor Verification

on:
  push:
    branches: [portfolio-recruiter-refactor]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-recruiter-refactor

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile for Speed Insights
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile when needed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Update lockfile for Speed Insights"
            git push origin HEAD:portfolio-recruiter-refactor
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production build
        run: |
          npm run start > /tmp/portfolio-next.log 2>&1 &
          echo $! > /tmp/portfolio-next.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-next.log
          exit 1

      - name: Run recruiter journey tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/home-recruiter-flow.spec.ts --project=chromium
