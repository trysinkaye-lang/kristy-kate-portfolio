name: Security lock refresh

on:
  push:
    branches:
      - portfolio-astra-wip-2026-09-11

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'chore: refresh patched Next.js lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-astra-wip-2026-09-11
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Refresh patched Next.js dependency and lockfile
        run: |
          npm install next@16.3.3 --save-exact
          npm install --save-dev eslint-config-next@16.3.3 --save-exact
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: refresh patched Next.js lockfile"
          git push origin HEAD:portfolio-astra-wip-2026-09-11
